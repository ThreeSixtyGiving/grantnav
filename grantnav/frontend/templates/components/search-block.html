<div class="search-block search-block--simple">
  <div class="wrapper">
    <div class="search-block__description">Search, explore and download grants data published by UK funders in the 360Giving Data Standard.</div>
    <div>
      <form role="search" action="{% url 'search' %}" id="search-form">
        <div class="search-block__label">
          {% block alert %}
            {% include 'components/targeting-search-tag.html' %}
          {% endblock alert %}
          <label class="search-block__form-item-label" for="search_query">Enter a search term</label>
        </div>
        <div class="search-block__form-group">
          <input name="text_query" id="text-query-input" class="form-control large-search" placeholder="Search grants, funders, recipients, locations" type="text" value="{{text_query}}">
          <input class="large-search-button" name="submit" type="submit" value="Search">
          <input type="hidden" name="a" value="1">
          <input type="hidden" name="sort" id="hidden-sort" value="_score desc">
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  document.getElementById('search-form').addEventListener('submit', function (e) {
    /* If no search query treat this like a link to avoid full search cycle
       and possibly incorrectly setting the search ordering
    */
    if (!document.getElementById('text-query-input').value) {
      e.preventDefault();
      window.location.href = "{% url 'search' %}";
    }
  });
</script>
